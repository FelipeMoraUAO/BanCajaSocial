<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Recuperar contrase&ntilde;a - Portal Personas Banco Caja Social</title>
  <link rel="icon" type="image/webp" href="../Images/iso-ban-caja-social.webp">
  <link rel="stylesheet" href="portal-login.css">
</head>
<body>
  <main class="recovery-page">
    <section class="recovery-visual" aria-label="Recuperar contrase&ntilde;a Portal Personas Banco Caja Social"></section>

    <section class="recovery-panel" aria-labelledby="recovery-title">
      <div class="recovery-card">
        <img class="brand-logo" src="../Images/Logo-Banco-Caja-Social.png" alt="Banco Caja Social. Su banco amigo. Una empresa de Fundaci&oacute;n Grupo Social.">

        <h1 id="recovery-title">&iquest;Olvid&oacute; su contrase&ntilde;a?</h1>

        <p class="login-help">
          Si olvid&oacute; o bloque&oacute; su contrase&ntilde;a, puede crear una nueva. Ingrese su correo electr&oacute;nico para enviarle los pasos de recuperaci&oacute;n.
        </p>

        <form class="recovery-form" action="#" method="post" novalidate>
          <div class="form-field">
            <label for="recovery-email">Correo electr&oacute;nico</label>
            <input id="recovery-email" name="email" type="email" autocomplete="email" placeholder="Ingresar correo electr&oacute;nico" autofocus>
            <small>Ejemplo: nombre@correo.com</small>
            <p class="input-error" id="recovery-email-error" hidden>
              Ingrese un correo electr&oacute;nico v&aacute;lido.
            </p>
          </div>

          <button class="next-button" id="recovery-button" type="submit" disabled>Enviar</button>
        </form>

        <hr>

        <a class="back-link" href="portal-personas.html" aria-label="Regresar al inicio de sesi&oacute;n">
          <span aria-hidden="true">&larr;</span>
          Regresar al inicio
        </a>
      </div>
    </section>
  </main>

  <script src="portal-login.js"></script>
</body>
</html>
