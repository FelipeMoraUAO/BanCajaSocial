<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Inicio de sesión - Portal Personas Banco Caja Social</title>
  <link rel="icon" type="image/webp" href="../Images/iso-ban-caja-social.webp">
  <link rel="stylesheet" href="portal-login.css">
</head>
<body>
  <main class="login-page login-page-modern">
    <section class="login-visual login-visual-modern" aria-label="Portal Personas Banco Caja Social"></section>

    <section class="login-panel" aria-labelledby="login-title">
      <div class="login-card">
        <img class="brand-logo" src="../Images/Logo-Banco-Caja-Social.png" alt="Banco Caja Social. Su banco amigo. Una empresa de Fundación Grupo Social.">

        <h1 id="login-title">Bienvenido al Portal Personas</h1>

        <p class="login-help">
          Ingrese con el correo electrónico registrado en el banco y su contraseña del portal.
        </p>

        <form class="login-form" action="#" method="post" novalidate>
          <div class="form-field">
            <label for="email">Correo electrónico</label>
            <input id="email" name="email" type="email" autocomplete="email" autofocus>
            <small>Ejemplo: nombre@correo.com</small>
            <p class="input-error" id="email-error" hidden>
              Ingrese un correo electrónico válido.
            </p>
          </div>

          <div class="form-field">
            <label for="password">Contraseña</label>
            <div class="password-wrap">
              <input id="password" name="password" type="password" autocomplete="current-password">
              <button class="password-toggle" type="button" aria-label="Mostrar contraseña" aria-controls="password">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
            <p class="input-error" id="password-error" hidden>
              Ingrese su contraseña.
            </p>
          </div>

          <div class="login-actions">
            <button class="next-button" id="next-button" type="submit" disabled>Ingresar</button>

            <div class="forgot-wrapper">
              <button class="forgot-button" type="button" id="forgot-button" aria-expanded="false" aria-controls="forgot-menu">
                ¿Olvidó su contraseña?
                <span aria-hidden="true"></span>
              </button>
              <div class="forgot-menu" id="forgot-menu" hidden>
                <a href="recuperar-contrasena.html">Recuperar contraseña</a>
              </div>
            </div>
          </div>
        </form>

        <hr>

        <p class="register-copy">
          ¿Es un cliente nuevo?
          <a href="registro.html">Registrarse</a>
        </p>
      </div>
    </section>
  </main>

  <script src="portal-login.js"></script>
</body>
</html>
