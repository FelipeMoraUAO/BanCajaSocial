<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Inicio de sesión - Portal Personas versión anterior</title>
  <link rel="icon" type="image/webp" href="../Images/iso-ban-caja-social.webp">
  <link rel="stylesheet" href="portal-login.css">
</head>
<body>
  <main class="login-page login-page-legacy">
    <section class="legacy-hero" aria-label="Portal Personas versión anterior">
      <img class="brand-logo" src="../Images/Logo_type2.png" alt="Banco Caja Social. Su banco amigo. Una empresa de Fundación Grupo Social.">
    </section>

    <section class="legacy-panel" aria-labelledby="legacy-title">
      <div class="legacy-card">
        <h1 id="legacy-title">Portal Personas<br><span>Versión anterior</span></h1>
        <p class="login-help">
          Ingrese con su tipo y número de identificación, sin espacios, puntos ni comas.
        </p>

        <form class="login-form" action="#" method="post" novalidate>
          <div class="form-field">
            <label for="legacy-username">Usuario</label>
            <input id="legacy-username" name="username" type="text" autocomplete="off" autofocus>
            <small>Ejemplo: CC1234567890</small>
            <p class="input-error" id="legacy-username-error" hidden>
              Datos incorrectos. Recuerde iniciar con CC, CE, NI, TI, PE.
            </p>
          </div>

          <div class="legacy-actions">
            <button class="primary-square-button" id="legacy-next-button" type="submit" disabled>Ingresar</button>
            <a href="#">¿Olvidó su contraseña?</a>
          </div>
        </form>

        <div class="legacy-register">
          <span>¿No está registrado?</span>
          <a href="#">Regístrese aquí</a>
        </div>
      </div>
    </section>
  </main>

  <script src="portal-login.js"></script>
</body>
</html>
